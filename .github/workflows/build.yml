name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win32:
    name: ${{ matrix.configuration }}|Win32
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, ReleaseHAXM, Debug]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The np21w tree may sit at the repo root or in a subdirectory; detect it
      # once here so every later step can use $env:PROJECT / $env:SRC / $env:VERIFY.
      - name: Resolve project layout
        run: |
          $candidates = @(
            'win9x/np21vs2019.vcxproj',
            'np21w-src-rev106/win9x/np21vs2019.vcxproj'
          )
          $proj = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $proj) {
            throw "np21vs2019.vcxproj not found in any of: $($candidates -join ', ')"
          }
          $src = Split-Path -Parent (Split-Path -Parent $proj)
          if ([string]::IsNullOrEmpty($src)) { $src = '.' }
          $verify = Join-Path $src '_verify_project.py'
          "PROJECT=$proj"      | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SRC=$src"           | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VERIFY=$verify"     | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOLUTION_NAME=np21vs2019" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "project   : $proj"
          Write-Output "src root  : $src"
          Write-Output "verify    : $verify"

      # Static self-check: catches dangling ClCompile/ClInclude references and
      # malformed .vcxproj/.filters XML before spending minutes on a real build.
      # A missing helper script is only a warning - it must never block the build.
      - name: Verify project integrity
        run: |
          if (-not (Test-Path $env:VERIFY)) {
            Write-Warning "$env:VERIFY not present in this checkout - skipping project verification"
            exit 0
          }
          $py = (Get-Command python -ErrorAction SilentlyContinue).Source
          if (-not $py) { $py = (Get-Command py -ErrorAction SilentlyContinue).Source }
          if (-not $py) { Write-Warning 'python not found - skipping project verification'; exit 0 }
          & $py $env:VERIFY

      - name: Install NASM
        run: |
          $ok = $false
          foreach ($i in 1..3) {
            choco install nasm --no-progress -y --ignore-checksums
            if ($?) { $ok = $true; break }
            Write-Warning "choco install nasm attempt $i failed, retrying..."
            Start-Sleep -Seconds 10
          }
          if (-not $ok) { throw 'nasm installation failed' }

      - name: Make NASM reachable
        run: |
          $candidates = @(
            (Join-Path $env:ProgramData 'chocolatey\bin'),
            (Join-Path $env:ProgramFiles 'NASM'),
            (Join-Path ${env:ProgramFiles(x86)} 'NASM')
          ) | Where-Object { Test-Path (Join-Path $_ 'nasm.exe') }
          if (-not $candidates) { throw 'nasm.exe was not installed' }
          foreach ($c in $candidates) { $c | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          nasm -v

      - name: Locate MSBuild
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vs = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw 'no Visual Studio installation with MSBuild found' }
          $msbuild = Join-Path $vs 'MSBuild\Current\Bin\MSBuild.exe'
          if (-not (Test-Path $msbuild)) { throw "MSBuild.exe not found at $msbuild" }
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $msbuild -version -nologo

          # np21w's sound/comm/misc modules (#include <atlbase.h>) need ATL, which is
          # absent from the default windows-latest VS install. Install the ATL/MFC
          # component so atlbase.h and atls.lib are available.
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vs_installer.exe'
          if (Test-Path $installer) {
            & $installer modify --installPath "$vs" --add Microsoft.VisualStudio.Component.VC.ATLMFC --quiet --norestart
            $atl = Get-ChildItem $vs -Recurse -Filter atlbase.h -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($atl) {
              Write-Output "atlbase.h: $($atl.FullName)"
              # Export the real atlmfc\include dir. The vcxproj consumes it via
              # $(ATLMFC_INCLUDE) in AdditionalIncludeDirectories - reliable for
              # every PlatformToolset (default/v143/v142), unlike UseOfAtl path
              # injection which points at a non-existent pre-2017 layout.
              "ATLMFC_INCLUDE=$($atl.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              # The ATL headers embed #pragma comment(lib, "atls.lib"), so the link
              # step needs atlmfc\lib\x86 on the library search path. MSBuild never
              # adds it (the vcxproj sets no UseOfAtl), so append it to LIB here.
              # Toolset lib dirs are injected via /LIBPATH and take precedence over
              # LIB, so this is purely additive and cannot shadow anything.
              $atlmfcLib = Join-Path (Split-Path -Parent $atl.DirectoryName) 'lib\x86'
              if (Test-Path $atlmfcLib) {
                "ATLMFC_LIB=$atlmfcLib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                $lib = $env:LIB
                if ([string]::IsNullOrEmpty($lib)) { $lib = '' } else { $lib = "$lib;" }
                "LIB=$lib$atlmfcLib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                Write-Output "atlmfc lib (x86): $atlmfcLib"
              } else { Write-Warning "atlmfc lib dir not found: $atlmfcLib" }
            } else { Write-Warning 'ATL installed but atlbase.h not found' }
          } else { Write-Warning 'vs_installer.exe not found - ATL unavailable' }

      # The .vcxproj pins no PlatformToolset, so the first attempt uses whatever
      # the installed Visual Studio defaults to (guaranteed to exist). windows-latest
      # currently ships VS2026, where that is v145 - v143 is only tried as a fallback.
      # The x86 objects come from win9x/x86/vs2010/x86.targets, which invokes plain
      # `nasm.exe -f win32` from PATH -> NASM must be on PATH.
      - name: Build (${{ matrix.configuration }}|Win32, default toolset)
        id: build_default
        continue-on-error: true
        run: |
          & $env:MSBUILD $env:PROJECT `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=Win32 `
            /p:SolutionName=$env:SOLUTION_NAME `
            /m /verbosity:minimal /nologo

      - name: Build (${{ matrix.configuration }}|Win32, v143)
        id: build143
        if: steps.build_default.outcome == 'failure'
        continue-on-error: true
        run: |
          & $env:MSBUILD $env:PROJECT `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=Win32 `
            /p:PlatformToolset=v143 `
            /p:SolutionName=$env:SOLUTION_NAME `
            /m /verbosity:minimal /nologo

      - name: Build (${{ matrix.configuration }}|Win32, v142)
        if: steps.build143.outcome == 'failure'
        run: |
          & $env:MSBUILD $env:PROJECT `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=Win32 `
            /p:PlatformToolset=v142 `
            /p:SolutionName=$env:SOLUTION_NAME `
            /m /verbosity:minimal /nologo

      # OutDir is `..\bin\$(SolutionName)\$(PlatformName)\$(Configuration)\` relative to
      # the vcxproj directory, i.e. `<src root>\bin\...`. Deterministic location first,
      # then a recursive fallback so a path change can never silently empty the artifact.
      - name: Collect artifacts
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path 'artifacts' | Out-Null
          $expected = Join-Path $env:SRC "bin\$env:SOLUTION_NAME\Win32\${{ matrix.configuration }}"
          if (Test-Path $expected) {
            Copy-Item -Path (Join-Path $expected '*') -Destination 'artifacts' -Recurse -Force
          }
          else {
            Write-Warning "expected output dir '$expected' not found, searching '$env:SRC' recursively"
            Get-ChildItem -Path $env:SRC -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -notmatch '\\\.git\\' -and (
                  $_.Name -like 'np2*.exe' -or $_.Name -like 'np2*.pdb' -or $_.Name -like 'np2*.map')
              } |
              ForEach-Object {
                $dest = Join-Path 'artifacts' $_.Directory.Name
                New-Item -ItemType Directory -Force -Path $dest | Out-Null
                Copy-Item -Path $_.FullName -Destination $dest -Force
              }
          }
          Get-ChildItem -Recurse artifacts -ErrorAction SilentlyContinue |
            Select-Object -First 40 FullName, Length | Format-Table -AutoSize

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: np21w-${{ matrix.configuration }}-Win32
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 14

  build-x64:
    name: ${{ matrix.configuration }}|x64
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # ReleaseWHPX|x64 is intentionally not built here: it additionally links
        # WinHvPlatform.lib/WinHvEmulation.lib and is unrelated to the ported
        # code. Add it to this list if you want full config coverage.
        configuration: [Release, Debug]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve project layout
        run: |
          $candidates = @(
            'win9x/np21vs2019.vcxproj',
            'np21w-src-rev106/win9x/np21vs2019.vcxproj'
          )
          $proj = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $proj) {
            throw "np21vs2019.vcxproj not found in any of: $($candidates -join ', ')"
          }
          $src = Split-Path -Parent (Split-Path -Parent $proj)
          if ([string]::IsNullOrEmpty($src)) { $src = '.' }
          $verify = Join-Path $src '_verify_project.py'
          "PROJECT=$proj"      | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SRC=$src"           | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VERIFY=$verify"     | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOLUTION_NAME=np21vs2019" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "project   : $proj"
          Write-Output "src root  : $src"
          Write-Output "verify    : $verify"

      - name: Verify project integrity
        run: |
          if (-not (Test-Path $env:VERIFY)) {
            Write-Warning "$env:VERIFY not present in this checkout - skipping project verification"
            exit 0
          }
          $py = (Get-Command python -ErrorAction SilentlyContinue).Source
          if (-not $py) { $py = (Get-Command py -ErrorAction SilentlyContinue).Source }
          if (-not $py) { Write-Warning 'python not found - skipping project verification'; exit 0 }
          & $py $env:VERIFY

      - name: Install NASM and YASM
        run: |
          foreach ($pkg in 'nasm', 'yasm') {
            $ok = $false
            foreach ($i in 1..3) {
              choco install $pkg --no-progress -y --ignore-checksums
              if ($?) { $ok = $true; break }
              Write-Warning "choco install $pkg attempt $i failed, retrying..."
              Start-Sleep -Seconds 10
            }
            if (-not $ok) { throw "$pkg installation failed" }
          }

      - name: Make assemblers reachable
        run: |
          $candidates = @(
            (Join-Path $env:ProgramData 'chocolatey\bin'),
            (Join-Path $env:ProgramFiles 'NASM'),
            (Join-Path $env:ProgramFiles 'YASM'),
            (Join-Path ${env:ProgramFiles(x86)} 'YASM')
          ) | Where-Object { Test-Path $_ }
          foreach ($c in $candidates) { $c | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          nasm -v
          yasm --version

      - name: Locate MSBuild
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vs = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw 'no Visual Studio installation with MSBuild found' }
          $msbuild = Join-Path $vs 'MSBuild\Current\Bin\MSBuild.exe'
          if (-not (Test-Path $msbuild)) { throw "MSBuild.exe not found at $msbuild" }
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $msbuild -version -nologo

          # np21w's sound/comm/misc modules (#include <atlbase.h>) need ATL, which is
          # absent from the default windows-latest VS install. Install the ATL/MFC
          # component so atlbase.h and atls.lib are available.
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vs_installer.exe'
          if (Test-Path $installer) {
            & $installer modify --installPath "$vs" --add Microsoft.VisualStudio.Component.VC.ATLMFC --quiet --norestart
            $atl = Get-ChildItem $vs -Recurse -Filter atlbase.h -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($atl) {
              Write-Output "atlbase.h: $($atl.FullName)"
              # Export the real atlmfc\include dir. The vcxproj consumes it via
              # $(ATLMFC_INCLUDE) in AdditionalIncludeDirectories - reliable for
              # every PlatformToolset (default/v143/v142), unlike UseOfAtl path
              # injection which points at a non-existent pre-2017 layout.
              "ATLMFC_INCLUDE=$($atl.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              # The ATL headers embed #pragma comment(lib, "atls.lib"), so the link
              # step needs atlmfc\lib\x64 on the library search path. MSBuild never
              # adds it (the vcxproj sets no UseOfAtl), so append it to LIB here.
              # Toolset lib dirs are injected via /LIBPATH and take precedence over
              # LIB, so this is purely additive and cannot shadow anything.
              $atlmfcLib = Join-Path (Split-Path -Parent $atl.DirectoryName) 'lib\x64'
              if (Test-Path $atlmfcLib) {
                "ATLMFC_LIB=$atlmfcLib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                $lib = $env:LIB
                if ([string]::IsNullOrEmpty($lib)) { $lib = '' } else { $lib = "$lib;" }
                "LIB=$lib$atlmfcLib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                Write-Output "atlmfc lib (x64): $atlmfcLib"
              } else { Write-Warning "atlmfc lib dir not found: $atlmfcLib" }
            } else { Write-Warning 'ATL installed but atlbase.h not found' }
          } else { Write-Warning 'vs_installer.exe not found - ATL unavailable' }

      # The x64 objects come from win9x/x64/vs2010/x64.targets, which invokes plain
      # `yasm -Xvc -f x64` from PATH -> YASM must be on PATH.
      - name: Build (${{ matrix.configuration }}|x64, default toolset)
        id: build_default
        continue-on-error: true
        run: |
          & $env:MSBUILD $env:PROJECT `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=x64 `
            /p:SolutionName=$env:SOLUTION_NAME `
            /m /verbosity:minimal /nologo

      - name: Build (${{ matrix.configuration }}|x64, v143)
        if: steps.build_default.outcome == 'failure'
        run: |
          & $env:MSBUILD $env:PROJECT `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /p:SolutionName=$env:SOLUTION_NAME `
            /m /verbosity:minimal /nologo

      - name: Collect artifacts
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path 'artifacts' | Out-Null
          $expected = Join-Path $env:SRC "bin\$env:SOLUTION_NAME\x64\${{ matrix.configuration }}"
          if (Test-Path $expected) {
            Copy-Item -Path (Join-Path $expected '*') -Destination 'artifacts' -Recurse -Force
          }
          else {
            Write-Warning "expected output dir '$expected' not found, searching '$env:SRC' recursively"
            Get-ChildItem -Path $env:SRC -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -notmatch '\\\.git\\' -and (
                  $_.Name -like 'np2*.exe' -or $_.Name -like 'np2*.pdb' -or $_.Name -like 'np2*.map')
              } |
              ForEach-Object {
                $dest = Join-Path 'artifacts' $_.Directory.Name
                New-Item -ItemType Directory -Force -Path $dest | Out-Null
                Copy-Item -Path $_.FullName -Destination $dest -Force
              }
          }
          Get-ChildItem -Recurse artifacts -ErrorAction SilentlyContinue |
            Select-Object -First 40 FullName, Length | Format-Table -AutoSize

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: np21w-${{ matrix.configuration }}-x64
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 14
